name: Testes e distribuição

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Obter o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar a CLI e as ferramentas de build
        run: python -m pip install . -r requirements-build.txt
      - name: Executar suíte de testes unitários e oráculo
        run: python -m unittest discover -s tests -v
      - name: Construir wheel e sdist
        run: python -m build
      - name: Conferir lista fechada, metadados, licença e RECORD
        run: python scripts/check_distribution.py --dist dist
      - name: Exercitar wheel instalado fora da árvore
        run: python scripts/check_distribution.py --install dist/orcamento_composicoes-1.0.0-py3-none-any.whl
      - name: Exercitar sdist instalado fora da árvore
        run: python scripts/check_distribution.py --install dist/orcamento_composicoes-1.0.0.tar.gz

  independent:
    name: Oráculo independente e SQLite sem rede
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Obter o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Instalar pacote
        run: python -m pip install .
      - name: Conferir namespace de rede isolado
        run: unshare --user --map-root-user --net -- true
      - name: Auditar pacote gerado pela CLI instalada sem rede
        run: |
          mkdir -p local
          unshare --user --map-root-user --net -- python tools/verify_independent.py --require-network-isolation --cli "$(command -v orcamento-composicoes)" --report local/independent-ci.json
